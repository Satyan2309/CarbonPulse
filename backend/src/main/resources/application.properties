# Server Configuration
spring.config.import=optional:classpath:application-local.properties
server.port=8080

# PostgreSQL (Neon DB Cloud)
# Credentials must be supplied via environment variables or application-local.properties
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecotrack?sslmode=disable}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Spring AI (OpenAI)
spring.ai.openai.api-key=${OPENAI_API_KEY:demo}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.7
openai.api.key=${OPENAI_API_KEY:demo}

# Security & JWT
# Secret must be a 256-bit Base64-encoded key (supplied via env var or application-local.properties)
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000

# Frontend URL for OAuth2 redirect
app.frontend-url=${FRONTEND_URL:http://localhost:4200}

# CORS Allowed Origins (comma-separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000,https://ecotrack-ai-carbon-tracker.vercel.app}

# Spring Mail (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=ecotrackcarbon.support@gmail.com
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# OAuth2 Client (Google)
google.client.id=${GOOGLE_CLIENT_ID:dummy-google-client-id}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Timezone: Force Jackson and Hibernate to use IST (Asia/Kolkata)
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata